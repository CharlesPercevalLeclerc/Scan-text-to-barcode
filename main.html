<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARCODE GEN v2.2</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --accent: #ffffff;
            --border: #333333;
            --gray: #888888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--accent);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px; /* Sedikit dikecilkan agar padat */
            border: 1px solid var(--accent);
            padding: 30px;
            background: var(--surface);
            position: relative;
        }

        h1 {
            font-weight: 900;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 25px;
            line-height: 1;
            border-left: 6px solid white;
            padding-left: 15px;
        }

        .input-group { margin-bottom: 15px; }
        
        label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            margin-bottom: 6px;
            color: var(--gray);
            text-transform: uppercase;
        }

        input, select {
            width: 100%;
            background: #111;
            border: 1px solid var(--border);
            padding: 12px;
            color: white;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem; /* Font input lebih besar */
            border-radius: 0;
            outline: none;
        }
        
        input:focus { border-color: var(--accent); }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 14px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        
        button:active { transform: scale(0.98); }

        button.secondary {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border);
        }

        #reader { 
            width: 100%; 
            margin-bottom: 15px;
            border: 1px dashed var(--border);
            overflow: hidden;
            border-radius: 4px;
        }

        /* --- UPDATE UTAMA ADA DI SINI (RESULT AREA) --- */
        #output-wrapper {
            margin-top: 30px;
            padding: 30px 20px; /* Padding vertikal lebih besar */
            background: white;
            border-radius: 12px; /* Radius lebih modern */
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: black;
            box-shadow: 0 10px 30px rgba(255,255,255,0.1);
        }

        /* Wadah untuk Barcode/QR agar ukuran konsisten */
        #display-area {
            width: 100%;
            height: 120px; /* Tinggi Tetap */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Memaksa SVG Barcode mengisi wadah */
        #display-area svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* Memaksa QR Code tetap di tengah */
        #display-area img, #display-area canvas {
            object-fit: contain;
            max-height: 100%;
        }

        .label-text {
            color: black;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem; /* Font hasil lebih terbaca */
            margin-top: 15px;
            font-weight: 800;
            text-align: center;
            line-height: 1.4;
            letter-spacing: -0.5px;
            border-top: 2px solid black;
            padding-top: 10px;
            width: 100%;
        }
        /* ----------------------------------------------- */

        .action-footer {
            margin-top: 15px;
            display: none;
            gap: 10px;
            width: 100%;
        }

        .watermark {
            margin-top: 40px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: var(--border);
            text-align: center;
        }

        #search-status {
            font-size: 0.7rem;
            margin-top: 5px;
            font-family: 'JetBrains Mono', monospace;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Barcode<br>Gen v2.2</h1>
    
    <div id="reader"></div>

    <div class="input-group">
        <label>PLU / Barcode ID</label>
        <input type="text" id="pluInput" placeholder="MASUKKAN KODE..." autocomplete="off">
        <div id="search-status"></div>
    </div>

    <div class="input-group">
        <label>Quantity (Opsional)</label>
        <input type="number" id="qtyInput" placeholder="JIKA ADA">
    </div>

    <div class="input-group">
        <label>Format Output</label>
        <select id="mode">
            <option value="BARCODE">BARCODE</option>
            <option value="QR">QR CODE</option>
        </select>
    </div>

    <div class="btn-grid">
        <button onclick="processData()">GENERATE</button>
        <button class="secondary" onclick="searchProduct()">Cari Nama (ID)</button>
        <button class="secondary" onclick="startScanner()">Scan Cam</button>
        <button class="secondary" onclick="clearData()">Reset</button>
    </div>

    <div id="output-wrapper">
        <div id="display-area"></div>
        <div class="label-text" id="info-text"></div>
    </div>

    <div class="action-footer" id="footer-actions">
        <button onclick="downloadImage()" style="width: 50%;">Simpan Gambar</button>
        <button onclick="shareWhatsApp()" class="secondary" style="width: 50%;">Share WA</button>
    </div>
</div>

<div class="watermark">
    barcode_gen v2.2 // 2026<br>MAINTAINED BY AFIF
</div>

<script>
    let html5QrCode;

    // 1. Generate Logic (UPDATED)
    function processData() {
        const plu = document.getElementById('pluInput').value.trim();
        const qty = document.getElementById('qtyInput').value.trim();
        const mode = document.getElementById('mode').value;
        const displayArea = document.getElementById('display-area');
        const infoText = document.getElementById('info-text');
        const wrapper = document.getElementById('output-wrapper');
        const footer = document.getElementById('footer-actions');

        if (!plu) return alert("INPUT TIDAK BOLEH KOSONG!");

        let finalData = plu;
        let displayText = `ITEM: ${plu}`;

        // Logic QTY jika diisi
        if (qty !== "") {
            const formattedQty = qty.toString().padStart(3, '0');
            finalData = `B${plu}${formattedQty}`;
            displayText += `<br>QTY: ${qty} PCS`;
        }

        displayArea.innerHTML = "";
        wrapper.style.display = "flex";
        footer.style.display = "flex";
        infoText.innerHTML = displayText; // Menggunakan innerHTML untuk <br>

        if (mode === "BARCODE") {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.id = "barcode-obj";
            // Set attribut preserveAspectRatio agar barcode melebar memenuhi container
            svg.setAttribute("preserveAspectRatio", "none"); 
            displayArea.appendChild(svg);
            
            JsBarcode("#barcode-obj", finalData, {
                format: "CODE128",
                lineColor: "#000",
                width: 2, // Lebar bar dasar
                height: 100, // Tinggi dasar (akan di-override CSS)
                displayValue: true, // Menampilkan angka di bawah bar
                margin: 0, // Hapus margin agar pas di container
                fontSize: 14,
                font: 'Monospace'
            });
        } else {
            // QR Code
            new QRCode(displayArea, {
                text: finalData,
                width: 120, // Ukuran fix menyesuaikan tinggi container
                height: 120,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });
        }

        // Scroll ke hasil
        wrapper.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 2. Search Product API
    async function searchProduct() {
        const plu = document.getElementById('pluInput').value;
        if (!plu) return alert("MASUKKAN KODE DULU");
        
        const status = document.getElementById('search-status');
        status.style.display = "block";
        status.style.color = "#ffff00";
        status.innerText = "MENGHUBUNGKAN SERVER...";

        try {
            const response = await fetch(`https://id.openfoodfacts.org/api/v0/product/${plu}.json`);
            const data = await response.json();

            if (data.status === 1) {
                const pName = data.product.product_name || data.product.generic_name || "Produk Tanpa Nama";
                status.style.color = "#00ff00";
                status.innerText = `✓ ${pName.substring(0, 30)}...`;
                document.getElementById('pluInput').value = pName; // Opsional: ganti input dengan nama
            } else {
                status.style.color = "#ff4444";
                status.innerText = "X DATA TIDAK DITEMUKAN";
            }
        } catch (e) {
            status.style.color = "#ff4444";
            status.innerText = "GAGAL KONEKSI (OFFLINE?)";
        }
    }

    // 3. Scanner Logic
    function startScanner() {
        const readerDiv = document.getElementById("reader");
        readerDiv.style.display = "block";
        
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 150 } },
            (decodedText) => {
                document.getElementById('pluInput').value = decodedText;
                
                // Stop & Hide scanner setelah dapat
                html5QrCode.stop().then(() => {
                    readerDiv.style.display = "none";
                    processData(); // Auto generate setelah scan
                });
            }
        ).catch(err => {
            alert("Izin kamera ditolak atau error.");
            readerDiv.style.display = "none";
        });
    }

    // 4. Reset Data
    function clearData() {
        document.getElementById('pluInput').value = "";
        document.getElementById('qtyInput').value = "";
        document.getElementById('search-status').style.display = "none";
        document.getElementById('display-area').innerHTML = "";
        document.getElementById('output-wrapper').style.display = "none";
        document.getElementById('footer-actions').style.display = "none";
        document.getElementById("reader").style.display = "none";
        if(html5QrCode && html5QrCode.isScanning) html5QrCode.stop();
    }

    // 5. Export Logic
    async function downloadImage() {
        const wrapper = document.getElementById('output-wrapper');
        
        // Render dengan skala tinggi untuk ketajaman
        const canvas = await html2canvas(wrapper, { 
            scale: 3,
            backgroundColor: "#ffffff",
            logging: false
        });
        
        const link = document.createElement('a');
        link.download = `TICKET-${Date.now()}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
    }

    async function shareWhatsApp() {
        const wrapper = document.getElementById('output-wrapper');
        const canvas = await html2canvas(wrapper, { scale: 3 });
        canvas.toBlob(async (blob) => {
            const file = new File([blob], 'barcode.png', { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title: 'METAL BARCODE TICKET' });
            } else {
                alert("Browser ini tidak mendukung fitur Share native.");
            }
        });
    }
</script>

</body>
</html>
