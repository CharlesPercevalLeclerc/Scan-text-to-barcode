<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan Angka/Teks ke Barcode dan QR</title>
<style>
:root{
  --bg:#eef1f3; --card:#fff; --ink:#14202b; --muted:#5b6b78; --line:#d3dbe1;
  --accent:#0b5fff; --accent-ink:#fff; --ok:#12a150; --err:#c62828;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0f161c; --card:#17212a; --ink:#e8eef2; --muted:#92a3b0; --line:#2a3945;
    --accent:#5b93ff; --accent-ink:#06142e; --ok:#3ddc84; --err:#ff8a80; }
}
:root[data-theme="dark"]{ --bg:#0f161c; --card:#17212a; --ink:#e8eef2; --muted:#92a3b0; --line:#2a3945;
    --accent:#5b93ff; --accent-ink:#06142e; --ok:#3ddc84; --err:#ff8a80; }
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.35rem;margin:8px 0 16px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.cam{position:relative;background:#0a0f13;border-radius:8px;overflow:hidden;min-height:180px;display:grid;place-items:center;color:#8fa0ad;text-align:center;font-size:.9rem}
.cam video{display:none;width:100%;height:auto}
.cam.on video{display:block}
.cam.on .ph{display:none}
.frame{display:none;position:absolute;left:6%;top:35%;width:88%;height:30%;pointer-events:none;
  box-shadow:0 0 0 999px rgba(0,0,0,.5)}
.cam.on .frame{display:block}
.frame i{position:absolute;width:22px;height:22px;border:3px solid #fff}
.frame i:nth-child(1){left:-2px;top:-2px;border-right:0;border-bottom:0}
.frame i:nth-child(2){right:-2px;top:-2px;border-left:0;border-bottom:0}
.frame i:nth-child(3){left:-2px;bottom:-2px;border-right:0;border-top:0}
.frame i:nth-child(4){right:-2px;bottom:-2px;border-left:0;border-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
button,.btn,select,textarea{font:inherit;color:inherit}
button,.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:10px 14px;cursor:pointer;min-height:44px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;flex:1}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px;min-height:44px}
label.lbl{display:block;font-size:.88rem;color:var(--muted);margin-bottom:6px}
textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.05rem;resize:vertical}
#status{min-height:1.4em;margin:10px 0 0;font-size:.9rem;color:var(--muted)}
#status.ok{color:var(--ok)} #status.err{color:var(--err)}
.out{display:grid;gap:14px;margin-top:14px}
.out figure{margin:0;text-align:center}
.out figcaption{font-size:.88rem;color:var(--muted);margin-bottom:6px}
.paper{background:#fff;border-radius:8px;padding:12px;display:inline-block;max-width:100%}
#qr img,#qr canvas{display:block;max-width:100%;height:auto}
#barcode{max-width:100%;height:auto;display:block}
.msg{font-size:.85rem;color:var(--err);margin:6px 0 0;min-height:1.2em}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Scan angka atau teks, jadikan barcode dan QR</h1>

  <section class="card" aria-label="Kamera">
    <div class="cam" id="cam">
      <span class="ph">Kamera belum menyala</span>
      <video id="video" playsinline muted></video>
      <div class="frame"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="row">
      <button id="btnCam">Nyalakan kamera</button>
      <button id="btnScan" class="primary" disabled>Scan isi kotak</button>
    </div>
    <div class="row">
      <select id="mode" aria-label="Mode baca">
        <option value="digits">Angka saja</option>
        <option value="text">Angka dan teks</option>
      </select>
      <label class="btn" for="file">Pakai foto
        <input id="file" type="file" accept="image/*" capture="environment" hidden>
      </label>
    </div>
    <p id="status" role="status"></p>
  </section>

  <section class="card" aria-label="Hasil">
    <label class="lbl" for="text">Isi kode (bisa diedit kalau hasil scan kurang pas)</label>
    <textarea id="text" rows="2" placeholder="Hasil scan muncul di sini, atau ketik manual"></textarea>
    <div class="row">
      <select id="fmt" aria-label="Jenis barcode">
        <option value="CODE128">Barcode CODE128 (semua teks)</option>
        <option value="CODE39">CODE39</option>
        <option value="EAN13">EAN-13 (12–13 angka)</option>
        <option value="EAN8">EAN-8 (7–8 angka)</option>
        <option value="UPC">UPC-A (11–12 angka)</option>
        <option value="ITF">ITF (angka, jumlah genap)</option>
      </select>
    </div>

    <div class="out" id="out" hidden>
      <figure>
        <figcaption>QR code</figcaption>
        <div class="paper"><div id="qr"></div></div>
        <div class="row" style="justify-content:center"><button id="dlQr">Simpan QR (PNG)</button></div>
        <p class="msg" id="qrErr"></p>
      </figure>
      <figure>
        <figcaption>Barcode</figcaption>
        <div class="paper"><canvas id="barcode"></canvas></div>
        <div class="row" style="justify-content:center"><button id="dlBar">Simpan barcode (PNG)</button></div>
        <p class="msg" id="barErr"></p>
      </figure>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('video'), cam = $('cam'), btnCam = $('btnCam'), btnScan = $('btnScan');
const modeSel = $('mode'), fileIn = $('file'), statusEl = $('status');
const textEl = $('text'), fmtSel = $('fmt'), out = $('out');
let stream = null, worker = null, busy = false;

function setStatus(msg, type){ statusEl.textContent = msg; statusEl.className = type || ''; }

/* ---------- Kamera ---------- */
async function startCam(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1280 } }, audio:false
    });
    video.srcObject = stream;
    await video.play();
    cam.classList.add('on');
    btnScan.disabled = false;
    btnCam.textContent = 'Matikan kamera';
    setStatus('Arahkan angka/teks ke dalam kotak, lalu tekan Scan.');
  }catch(e){
    setStatus('Kamera tidak bisa dibuka (' + e.name + '). Izinkan akses kamera, dan buka halaman lewat HTTPS atau localhost. Atau pakai tombol “Pakai foto”.', 'err');
  }
}
function stopCam(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  cam.classList.remove('on');
  btnScan.disabled = true;
  btnCam.textContent = 'Nyalakan kamera';
  setStatus('');
}
btnCam.onclick = () => stream ? stopCam() : startCam();

/* ---------- OCR ---------- */
async function getWorker(){
  if(worker) return worker;
  worker = await Tesseract.createWorker('eng', 1, {
    logger: m => {
      if(m.status === 'recognizing text') setStatus('Membaca… ' + Math.round(m.progress * 100) + '%');
      else if(m.status && m.status.includes('loading')) setStatus('Menyiapkan OCR (sekali saja)…');
    }
  });
  return worker;
}

// Potong area, ubah ke abu-abu dan naikkan kontras supaya lebih mudah dibaca
function prep(src, sx, sy, sw, sh){
  const scale = Math.min(1, 1600 / sw);
  const c = document.createElement('canvas');
  c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
  const x = c.getContext('2d', { willReadFrequently:true });
  x.drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const img = x.getImageData(0, 0, c.width, c.height), p = img.data;
  for(let i = 0; i < p.length; i += 4){
    let g = .299 * p[i] + .587 * p[i+1] + .114 * p[i+2];
    g = (g - 128) * 1.5 + 128;
    p[i] = p[i+1] = p[i+2] = g < 0 ? 0 : g > 255 ? 255 : g;
  }
  x.putImageData(img, 0, 0);
  return c;
}

async function runOCR(canvas){
  if(busy) return;
  busy = true; btnScan.disabled = true;
  try{
    const digits = modeSel.value === 'digits';
    const w = await getWorker();
    await w.setParameters({
      tessedit_char_whitelist: digits ? '0123456789' : '',
      tessedit_pageseg_mode: '6'
    });
    const { data } = await w.recognize(canvas);
    let t = (data.text || '').trim();
    t = digits ? t.replace(/\D/g, '') : t.replace(/\s+/g, ' ');
    if(!t){ setStatus('Tidak ada yang terbaca. Dekatkan kamera, tambah cahaya, atau pastikan teks lurus di dalam kotak.', 'err'); return; }
    textEl.value = t;
    render();
    setStatus('Selesai. Periksa hasilnya, edit kalau ada yang salah.', 'ok');
  }catch(e){
    setStatus('Gagal membaca: ' + (e.message || e), 'err');
  }finally{
    busy = false; btnScan.disabled = !stream;
  }
}

btnScan.onclick = () => {
  const vw = video.videoWidth, vh = video.videoHeight;
  if(!vw) return;
  // sama dengan posisi kotak di layar: kiri 6%, atas 35%, lebar 88%, tinggi 30%
  runOCR(prep(video, vw * .06, vh * .35, vw * .88, vh * .30));
};

fileIn.onchange = () => {
  const f = fileIn.files[0]; if(!f) return;
  const img = new Image();
  img.onload = () => { runOCR(prep(img, 0, 0, img.naturalWidth, img.naturalHeight)); URL.revokeObjectURL(img.src); };
  img.onerror = () => setStatus('Foto tidak bisa dibuka.', 'err');
  img.src = URL.createObjectURL(f);
  fileIn.value = '';
};

/* ---------- Buat QR dan barcode ---------- */
function render(){
  const val = textEl.value.trim();
  out.hidden = !val;
  if(!val) return;

  // QR
  const qr = $('qr'); qr.innerHTML = ''; $('qrErr').textContent = '';
  try{
    new QRCode(qr, { text: val, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  }catch(e){
    $('qrErr').textContent = 'Teks terlalu panjang untuk QR code.';
  }

  // Barcode
  const c = $('barcode'), err = $('barErr'); err.textContent = '';
  try{
    JsBarcode(c, val, { format: fmtSel.value, displayValue:true, margin:8, height:80, width:2,
      background:'#ffffff', lineColor:'#000000', fontSize:16 });
  }catch(e){
    c.getContext('2d').clearRect(0, 0, c.width, c.height);
    c.width = 1; c.height = 1;
    err.textContent = 'Isi ini tidak cocok untuk format ' + fmtSel.value + '. Coba CODE128.';
  }
}
textEl.addEventListener('input', render);
fmtSel.addEventListener('change', render);

/* ---------- Simpan PNG ---------- */
function save(canvas, name){
  if(!canvas || canvas.width < 2) return;
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png'); a.download = name; a.click();
}
$('dlQr').onclick = () => save($('qr').querySelector('canvas'), 'qr-code.png');
$('dlBar').onclick = () => save($('barcode'), 'barcode.png');

window.addEventListener('pagehide', stopCam);
</script>
</body>
</html>
